<div class="profile-intro">
  <h1 class="page__title" itemprop="headline">{{ page.title | escape }}</h1>
  <p class="profile-intro__role">{{ page.profile_role | escape }}</p>
  <p class="profile-intro__summary">{{ page.profile_summary | escape }}</p>
  <div class="profile-intro__links">
    <a class="profile-intro__primary" href="{{ '/portfolio/' | relative_url }}">View portfolio</a>
    <a href="{{ '/publications/' | relative_url }}">Publications</a>
    <a href="{{ '/cv/' | relative_url }}">CV</a>
  </div>
</div>
